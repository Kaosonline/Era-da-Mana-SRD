<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisão de Traduções - Era da Mana SRD</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
    }

    .header {
      background: #ffffff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #06b6d4;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.1);
    }

    .header h1 {
      font-size: 1.2rem;
      color: #0f172a;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .category-select, .filter-select {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .category-select:hover, .filter-select:hover {
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
    }

    .category-select:focus, .filter-select:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    .main-container {
      display: flex;
      height: calc(100vh - 52px);
    }

    .sidebar {
      width: 280px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 2px 0 8px rgba(6, 182, 212, 0.06);
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      padding: 8px 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      color: #0f172a;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
      outline: none;
    }

    .search-input::placeholder { color: #94a3b8; }

    .progress-bar-container {
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .progress-bar {
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6);
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.3);
    }

    .progress-text {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .file-item {
      padding: 8px 10px;
      margin-bottom: 4px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }

    .file-item:hover { background: #f1f5f9; }
    .file-item.active { 
      background: #f1f5f9; 
      border-left-color: #06b6d4; 
      box-shadow: -2px 0 8px rgba(6, 182, 212, 0.15);
    }

    .file-item .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .file-item .status-dot.pending { background: #94a3b8; }
    .file-item .status-dot.approved { background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }
    .file-item .status-dot.needs-fix { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
    .file-item .status-dot.skipped { background: #8b5cf6; box-shadow: 0 0 6px rgba(139, 92, 246, 0.4); }

    .file-item .title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-toolbar {
      padding: 10px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.06);
    }

    .editor-title {
      font-size: 1rem;
      font-weight: 600;
      color: #0f172a;
    }

    .editor-nav {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-nav {
      background: #ffffff;
      color: #06b6d4;
      border: 1px solid #06b6d4;
    }

    .btn-nav:hover:not(:disabled) {
      background: rgba(6, 182, 212, 0.1);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
    }

    .btn-save {
      background: #10b981;
      color: #ffffff;
      border: none;
    }

    .btn-save:hover:not(:disabled) {
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .btn-export {
      background: #8b5cf6;
      color: #ffffff;
      border: none;
    }

    .btn-export:hover {
      background: #a78bfa;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .btn-import {
      background: #06b6d4;
      color: #ffffff;
      border: none;
    }

    .btn-import:hover {
      background: #22d3ee;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    .btn-approve {
      background: #3b82f6;
      color: #ffffff;
      border: none;
    }

    .btn-approve:hover:not(:disabled) {
      background: #60a5fa;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-needs-fix {
      background: #ef4444;
      color: #ffffff;
      border: none;
    }

    .btn-needs-fix:hover:not(:disabled) {
      background: #f87171;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }

    .btn-skip {
      background: #8b5cf6;
      color: #ffffff;
      border: none;
    }

    .btn-skip:hover:not(:disabled) {
      background: #a78bfa;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .btn-delete {
      background: #ef4444;
      color: #ffffff;
      border: none;
    }

    .btn-delete:hover:not(:disabled) {
      background: #f87171;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }

    .btn-link {
      background: #06b6d4;
      color: #ffffff;
      border: none;
    }

    .btn-link:hover:not(:disabled) {
      background: #22d3ee;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    .btn-table {
      background: #8b5cf6;
      color: #ffffff;
      border: none;
    }

    .btn-table:hover:not(:disabled) {
      background: #a78bfa;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .status-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .editor-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-textarea {
      flex: 1;
      width: 100%;
      padding: 16px;
      background: #ffffff;
      color: #0f172a;
      border: none;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    .editor-textarea:focus {
      background: #f8fafc;
      box-shadow: inset 0 0 0 2px #06b6d4;
    }

    .welcome-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .welcome-screen h2 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .welcome-screen p {
      color: #64748b;
      max-width: 400px;
      line-height: 1.6;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-top: 24px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item .number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #06b6d4;
    }

    .stat-item .label {
      font-size: 0.75rem;
      color: #64748b;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success { 
      background: #10b981; 
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }
    .toast.error { 
      background: #ef4444; 
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
    }
    .toast.info { 
      background: #06b6d4; 
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #e2e8f0;
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .current-status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .current-status-badge.pending { 
      background: #f1f5f9; 
      color: #64748b; 
      border: 1px solid #e2e8f0; 
    }
    .current-status-badge.approved { 
      background: rgba(16, 185, 129, 0.15); 
      color: #10b981; 
      border: 1px solid #10b981; 
    }
    .current-status-badge.needs-fix { 
      background: rgba(239, 68, 68, 0.15); 
      color: #ef4444; 
      border: 1px solid #ef4444; 
    }
    .current-status-badge.skipped { 
      background: rgba(139, 92, 246, 0.15); 
      color: #8b5cf6; 
      border: 1px solid #8b5cf6; 
    }

    .has-changes-indicator {
      color: #8b5cf6;
      font-size: 0.75rem;
      margin-left: 4px;
      font-weight: 500;
    }

    .link-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(6, 182, 212, 0.12);
      backdrop-filter: blur(4px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-modal {
      background: #ffffff;
      border: 1px solid #06b6d4;
      border-radius: 8px;
      padding: 20px;
      width: 450px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(6, 182, 212, 0.15);
    }

    .link-modal h3 {
      color: #0f172a;
      margin-bottom: 12px;
      font-size: 1rem;
      font-weight: 600;
    }

    .link-modal .selected-text-preview {
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #0f172a;
      margin-bottom: 12px;
      word-break: break-word;
      border: 1px solid #e2e8f0;
    }

    .link-modal input {
      width: 100%;
      padding: 8px 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      color: #0f172a;
      font-size: 0.85rem;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .link-modal input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
    }

    .link-modal .suggestions-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 6px;
    }

    .link-modal .suggestions-list {
      flex: 1;
      overflow-y: auto;
      max-height: 250px;
      margin-bottom: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
    }

    .link-modal .suggestion-item {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
      border-bottom: 1px solid #f1f5f9;
    }

    .link-modal .suggestion-item:last-child { border-bottom: none; }
    .link-modal .suggestion-item:hover { background: #f1f5f9; }
    .link-modal .suggestion-item.selected { 
      background: rgba(6, 182, 212, 0.1); 
      border: 1px solid #06b6d4;
    }

    .link-modal .suggestion-item .match-score {
      font-size: 0.7rem;
      color: #64748b;
      margin-left: auto;
    }

    .link-modal .suggestion-item .cat-badge {
      font-size: 0.65rem;
      background: #8b5cf6;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .link-modal .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .link-modal .no-results {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
    <div class="header">
    <h1>Revisão de Traduções</h1>
    <div class="header-controls">
      <button class="btn btn-nav" id="btnExport" title="Exportar progresso">📤 Exportar</button>
      <button class="btn btn-nav" id="btnImport" title="Importar progresso">📥 Importar</button>
      <select id="categorySelect" class="category-select">
        <option value="">Carregando categorias...</option>
      </select>
      <select id="statusFilter" class="filter-select">
        <option value="all">Todos</option>
        <option value="pending">Pendentes</option>
        <option value="approved">Aprovados</option>
        <option value="needs-fix">Precisa corrigir</option>
        <option value="skipped">Pulados</option>
      </select>
    </div>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar arquivo...">
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="progressText">0 de 0 revisados</div>
      </div>
      <div class="file-list" id="fileList">
        <div class="loading">
          <div class="loading-spinner"></div>
          Carregando...
        </div>
      </div>
    </div>

    <div class="editor-area" id="editorArea">
      <div class="welcome-screen" id="welcomeScreen">
        <h2>Bem-vindo à Revisão de Traduções</h2>
        <p id="welcomeMsg">⏳ Carregando...</p>
        <div class="stats" id="globalStats" style="display:none;">
          <div class="stat-item">
            <div class="number" id="statTotal">0</div>
            <div class="label">Total</div>
          </div>
          <div class="stat-item">
            <div class="number" id="statApproved">0</div>
            <div class="label">Aprovados</div>
          </div>
          <div class="stat-item">
            <div class="number" id="statNeedsFix">0</div>
            <div class="label">Precisa corrigir</div>
          </div>
          <div class="stat-item">
            <div class="number" id="statPending">0</div>
            <div class="label">Pendentes</div>
          </div>
        </div>
      </div>

      <div id="editorContent" style="display: none; flex: 1; flex-direction: column; overflow: hidden;">
        <div class="editor-toolbar">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span class="editor-title" id="editorTitle"></span>
            <span class="current-status-badge pending" id="currentStatusBadge">Pendente</span>
            <span class="has-changes-indicator" id="hasChangesIndicator" style="display: none;">✏️ Alterações não salvas</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <div class="editor-nav">
              <button class="btn btn-nav" id="btnPrev" title="Anterior">← Anterior</button>
              <button class="btn btn-nav" id="btnNext" title="Próximo">Próximo →</button>
              <button class="btn btn-link" id="btnTable" title="Criar Tabela">📊 Tabela</button>
            </div>
            <div class="status-actions">
              <button class="btn btn-link" id="btnLink" title="Criar Link (Ctrl+K)">🔗 Link</button>
              <button class="btn btn-save" id="btnSave" title="Salvar (Ctrl+S)">💾 Salvar</button>
              <button class="btn btn-approve" id="btnApprove" title="Aprovar">✅ Aprovar</button>
              <button class="btn btn-needs-fix" id="btnNeedsFix" title="Precisa corrigir">❌ Precisa corrigir</button>
              <button class="btn btn-delete" id="btnDelete" title="Deletar">🗑️ Deletar</button>
            </div>
          </div>
        </div>
        <div class="editor-content">
          <textarea class="editor-textarea" id="editorTextarea" placeholder="Carregando conteúdo..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="link-modal-overlay" id="linkModalOverlay" style="display: none;">
    <div class="link-modal">
      <h3>🔗 Criar Link Markdown</h3>
      <div class="selected-text-preview" id="linkSelectedPreview"></div>
      <input type="text" id="linkSearchInput" placeholder="Buscar arquivo correspondente...">
      <div class="suggestions-label" id="suggestionsLabel">Sugestões:</div>
      <div class="suggestions-list" id="suggestionsList"></div>
      <div class="modal-actions">
        <button class="btn btn-nav" id="btnLinkCancel">Cancelar</button>
        <button class="btn btn-link" id="btnLinkInsert" disabled>Inserir Link</button>
      </div>
    </div>
  </div>

  <script>
    // Estado da aplicação
    const state = {
      categories: [],
      currentCategory: '',
      files: [],
      filteredFiles: [],
      currentIndex: -1,
      currentFileId: null,
      currentContent: '',
      hasChanges: false,
      status: {}, // { 'category/id': 'approved' | 'needs-fix' | 'skipped' | 'pending' }
      searchQuery: '',
      statusFilter: 'all',
      loading: false,
      allFiles: [],
      linkSelection: null // { text, start, end }
    };

    // Elementos DOM
    const els = {
      categorySelect: document.getElementById('categorySelect'),
      statusFilter: document.getElementById('statusFilter'),
      searchInput: document.getElementById('searchInput'),
      fileList: document.getElementById('fileList'),
      progressFill: document.getElementById('progressFill'),
      progressText: document.getElementById('progressText'),
      welcomeScreen: document.getElementById('welcomeScreen'),
      editorContent: document.getElementById('editorContent'),
      editorTitle: document.getElementById('editorTitle'),
      currentStatusBadge: document.getElementById('currentStatusBadge'),
      hasChangesIndicator: document.getElementById('hasChangesIndicator'),
      editorTextarea: document.getElementById('editorTextarea'),
      btnPrev: document.getElementById('btnPrev'),
      btnNext: document.getElementById('btnNext'),
      btnSave: document.getElementById('btnSave'),
      btnApprove: document.getElementById('btnApprove'),
      btnNeedsFix: document.getElementById('btnNeedsFix'),
      btnDelete: document.getElementById('btnDelete'),
      btnExport: document.getElementById('btnExport'),
      btnImport: document.getElementById('btnImport'),
      toast: document.getElementById('toast'),
      statTotal: document.getElementById('statTotal'),
      statApproved: document.getElementById('statApproved'),
      statNeedsFix: document.getElementById('statNeedsFix'),
      statPending: document.getElementById('statPending'),
      globalStats: document.getElementById('globalStats'),
      btnLink: document.getElementById('btnLink'),
      btnTable: document.getElementById('btnTable'),
      linkModalOverlay: document.getElementById('linkModalOverlay'),
      linkSelectedPreview: document.getElementById('linkSelectedPreview'),
      linkSearchInput: document.getElementById('linkSearchInput'),
      suggestionsLabel: document.getElementById('suggestionsLabel'),
      suggestionsList: document.getElementById('suggestionsList'),
      btnLinkCancel: document.getElementById('btnLinkCancel'),
      btnLinkInsert: document.getElementById('btnLinkInsert')
    };

    // Carregar progresso do arquivo JSON e localStorage
    async function loadProgress() {
      // Primeiro tenta carregar do arquivo JSON no servidor
      try {
        const res = await fetch('/api/export-progress');
        if (res.ok) {
          const data = await res.json();
          if (data.status) {
            state.status = data.status;
            localStorage.setItem('reviewProgress', JSON.stringify(data.status));
          }
          if (data.lastCategory) {
            state.currentCategory = data.lastCategory;
            localStorage.setItem('lastCategory', data.lastCategory);
          }
        }
      } catch (e) {
        console.log('Arquivo de progresso não encontrado, usando localStorage');
      }

      // Complementa com localStorage (para índices por categoria)
      try {
        const saved = localStorage.getItem('reviewProgress');
        if (saved && Object.keys(state.status).length === 0) {
          state.status = JSON.parse(saved);
        }
        const lastCategory = localStorage.getItem('lastCategory');
        if (lastCategory && !state.currentCategory) {
          state.currentCategory = lastCategory;
        }
      } catch (e) {
        console.error('Erro ao carregar do localStorage:', e);
      }
    }

    // Salvar progresso no localStorage
    function saveProgress() {
      try {
        localStorage.setItem('reviewProgress', JSON.stringify(state.status));
        localStorage.setItem('lastCategory', state.currentCategory);
        localStorage.setItem(`lastIndex_${state.currentCategory}`, state.currentIndex.toString());
      } catch (e) {
        console.error('Erro ao salvar progresso:', e);
      }
    }

    // Mostrar toast
    function showToast(message, type = 'info') {
      els.toast.textContent = message;
      els.toast.className = `toast ${type} show`;
      setTimeout(() => {
        els.toast.classList.remove('show');
      }, 2500);
    }

    // Carregar categorias
    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        const categories = await res.json();
        state.categories = categories;

        if (categories.length === 0) {
          document.getElementById('welcomeMsg').textContent = '❌ Nenhuma categoria encontrada. Verifique se a pasta src/content existe.';
          els.categorySelect.innerHTML = '<option value="">Nenhuma categoria</option>';
          return;
        }

        els.categorySelect.innerHTML = categories.map(cat =>
          `<option value="${cat}" ${cat === state.currentCategory ? 'selected' : ''}>${cat}</option>`
        ).join('');

        document.getElementById('welcomeMsg').textContent = `${categories.length} categoria(s) disponível(is).`;

        // Se tem categoria salva, carrega ela; senão carrega a primeira (prioriza magias)
        if (state.currentCategory && categories.includes(state.currentCategory)) {
          loadFiles(state.currentCategory);
        } else if (categories.length > 0) {
          // Prioriza 'magias', senão usa a primeira disponível
          const defaultCat = categories.includes('magias') ? 'magias' : categories[0];
          state.currentCategory = defaultCat;
          els.categorySelect.value = defaultCat;
          loadFiles(defaultCat);
        }
      } catch (err) {
        console.error('Erro ao carregar categorias:', err);
        document.getElementById('welcomeMsg').textContent = '❌ Erro ao carregar categorias. Verifique se o servidor está rodando.';
        els.categorySelect.innerHTML = '<option value="">Erro</option>';
        showToast('Erro ao carregar categorias', 'error');
      }
    }

    // Carregar arquivos de uma categoria
    async function loadFiles(category) {
      state.loading = true;
      state.currentCategory = category;
      state.currentIndex = -1;
      els.fileList.innerHTML = `<div class="loading"><div class="loading-spinner"></div>Carregando ${category}...</div>`;

      try {
        const res = await fetch(`/api/list/${category}`);
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        const files = await res.json();
        state.files = files.sort((a, b) => a.id.localeCompare(b.id));
        applyFilters();

        // Mostrar estatísticas na tela de boas-vindas
        document.getElementById('welcomeMsg').textContent = `${files.length} arquivo(s) em "${category}". Selecione para revisar.`;
        els.globalStats.style.display = 'flex';

        // Tentar restaurar último índice
        const savedIndex = parseInt(localStorage.getItem(`lastIndex_${category}`) || '-1');
        if (savedIndex >= 0 && savedIndex < state.filteredFiles.length) {
          selectFile(savedIndex, true);
        } else if (state.filteredFiles.length > 0) {
          selectFile(0, true);
        }

        updateGlobalStats();
      } catch (err) {
        console.error('Erro ao carregar arquivos:', err);
        showToast('Erro ao carregar arquivos: ' + err.message, 'error');
        els.fileList.innerHTML = '<div class="loading">❌ Erro ao carregar arquivos</div>';
        document.getElementById('welcomeMsg').textContent = '❌ Erro ao carregar arquivos.';
      }

      state.loading = false;
    }

    // Aplicar filtros
    function applyFilters() {
      let filtered = [...state.files];

      // Filtro por busca
      if (state.searchQuery) {
        const query = state.searchQuery.toLowerCase();
        filtered = filtered.filter(f => f.id.toLowerCase().includes(query));
      }

      // Filtro por status
      if (state.statusFilter !== 'all') {
        filtered = filtered.filter(f => {
          const key = `${state.currentCategory}/${f.id}`;
          const status = state.status[key] || 'pending';
          return status === state.statusFilter;
        });
      }

      state.filteredFiles = filtered;
      renderFileList();
      updateProgressBar();
    }

    // Renderizar lista de arquivos
    function renderFileList() {
      if (state.filteredFiles.length === 0) {
        els.fileList.innerHTML = '<div class="loading">Nenhum arquivo encontrado</div>';
        return;
      }

      els.fileList.innerHTML = state.filteredFiles.map((file, index) => {
        const key = `${state.currentCategory}/${file.id}`;
        const status = state.status[key] || 'pending';
        const isActive = index === state.currentIndex;
        const title = file.id.replace(/-/g, ' ').replace(/_/g, ' ');

        return `
          <div class="file-item ${isActive ? 'active' : ''}" data-index="${index}">
            <span class="status-dot ${status}"></span>
            <span class="title" title="${file.id}">${title}</span>
          </div>
        `;
      }).join('');

      // Adicionar event listeners
      els.fileList.querySelectorAll('.file-item').forEach(item => {
        item.addEventListener('click', () => {
          const index = parseInt(item.dataset.index);
          selectFile(index);
        });
      });
    }

    // Selecionar arquivo
    async function selectFile(index, skipConfirm = false) {
      if (index < 0 || index >= state.filteredFiles.length) return;

      // Verificar se há alterações não salvas
      if (!skipConfirm && state.hasChanges) {
        const shouldProceed = confirm('Você tem alterações não salvas. Deseja continuar sem salvar?');
        if (!shouldProceed) return;
      }

      state.currentIndex = index;
      state.currentFileId = state.filteredFiles[index].id;
      const file = state.filteredFiles[index];
      const key = `${state.currentCategory}/${file.id}`;

      // UI updates
      els.welcomeScreen.style.display = 'none';
      els.editorContent.style.display = 'flex';

      // Atualizar título
      const title = file.id.replace(/-/g, ' ').replace(/_/g, ' ');
      els.editorTitle.textContent = title;

      // Atualizar badge de status
      const status = state.status[key] || 'pending';
      updateStatusBadge(status);

      // Reset has changes
      state.hasChanges = false;
      els.hasChangesIndicator.style.display = 'none';

      // Carregar conteúdo
      els.editorTextarea.value = 'Carregando...';
      els.editorTextarea.disabled = true;

      try {
        const res = await fetch(`/api/read/${state.currentCategory}/${file.id}`);
        const data = await res.json();
        state.currentContent = data.content;
        els.editorTextarea.value = data.content;
        els.editorTextarea.disabled = false;

        // Highlight no file list
        renderFileList();

        // Atualizar botões de navegação
        els.btnPrev.disabled = index === 0;
        els.btnNext.disabled = index === state.filteredFiles.length - 1;

        // Salvar posição
        saveProgress();
      } catch (err) {
        showToast('Erro ao carregar arquivo', 'error');
        els.editorTextarea.value = 'Erro ao carregar conteúdo';
      }
    }

    // Atualizar badge de status
    function updateStatusBadge(status) {
      const labels = {
        'pending': 'Pendente',
        'approved': 'Aprovado',
        'needs-fix': 'Precisa corrigir',
        'skipped': 'Pulado'
      };
      els.currentStatusBadge.textContent = labels[status] || 'Pendente';
      els.currentStatusBadge.className = `current-status-badge ${status}`;
    }

    // Salvar conteúdo
    async function saveContent() {
      if (!state.currentFileId) return;

      const content = els.editorTextarea.value;

      els.btnSave.disabled = true;
      els.btnSave.textContent = 'Salvando...';

      try {
        const res = await fetch(`/api/save/${state.currentCategory}/${state.currentFileId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });

        const data = await res.json();

        if (data.success) {
          state.currentContent = content;
          state.hasChanges = false;
          els.hasChangesIndicator.style.display = 'none';
          
          // Salvar progresso no arquivo JSON
          await fetch('/api/import-progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              status: state.status, 
              lastCategory: state.currentCategory 
            })
          });
          
          showToast('Arquivo salvo com sucesso!', 'success');
        } else {
          showToast('Erro ao salvar: ' + data.error, 'error');
        }
      } catch (err) {
        showToast('Erro ao salvar arquivo', 'error');
      }

      els.btnSave.disabled = false;
      els.btnSave.textContent = '💾 Salvar';
    }

    // Deletar arquivo atual
    async function deleteCurrentFile() {
      if (!state.currentFileId) return;
      
      const confirmDelete = confirm(`Deseja realmente deletar o arquivo "${state.currentFileId}.md"?`);
      if (!confirmDelete) return;

      try {
        const res = await fetch(`/api/delete/${state.currentCategory}/${state.currentFileId}`, {
          method: 'DELETE'
        });

        const data = await res.json();

        if (data.success) {
          showToast('Arquivo deletado!', 'success');
          
          // Remover da lista de arquivos
          state.files = state.files.filter(f => f.id !== state.currentFileId);
          state.filteredFiles = state.filteredFiles.filter(f => f.id !== state.currentFileId);
          
          // Limpar editor
          state.currentFileId = null;
          state.currentContent = '';
          els.editorContent.style.display = 'none';
          els.welcomeScreen.style.display = 'flex';
          
          renderFileList();
          updateProgressBar();
          updateGlobalStats();
        } else {
          showToast('Erro ao deletar: ' + data.error, 'error');
        }
      } catch (err) {
        showToast('Erro ao deletar arquivo', 'error');
      }
    }

    // Definir status
    async function setStatus(status) {
      if (!state.currentFileId) return;

      const key = `${state.currentCategory}/${state.currentFileId}`;

      state.status[key] = status;
      updateStatusBadge(status);
      saveProgress();
      renderFileList();
      updateProgressBar();
      updateGlobalStats();

      // Salvar progresso no arquivo JSON
      await fetch('/api/import-progress', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          status: state.status, 
          lastCategory: state.currentCategory 
        })
      });

      const labels = {
        'approved': 'Aprovado',
        'needs-fix': 'Precisa corrigir',
        'skipped': 'Pulado'
      };
      showToast(`Marcado como "${labels[status]}"`, 'success');
    }

    // Atualizar barra de progresso
    function updateProgressBar() {
      const total = state.files.length;
      const reviewed = state.files.filter(f => {
        const key = `${state.currentCategory}/${f.id}`;
        return state.status[key] && state.status[key] !== 'pending';
      }).length;

      const percent = total > 0 ? (reviewed / total) * 100 : 0;
      els.progressFill.style.width = `${percent}%`;
      els.progressText.textContent = `${reviewed} de ${total} revisados (${Math.round(percent)}%)`;
    }

    // Atualizar estatísticas globais
    function updateGlobalStats() {
      const total = state.files.length;
      let approved = 0, needsFix = 0, pending = 0;

      state.files.forEach(f => {
        const key = `${state.currentCategory}/${f.id}`;
        const status = state.status[key] || 'pending';
        if (status === 'approved') approved++;
        else if (status === 'needs-fix') needsFix++;
        else pending++;
      });

      els.statTotal.textContent = total;
      els.statApproved.textContent = approved;
      els.statNeedsFix.textContent = needsFix;
      els.statPending.textContent = pending;
    }

    // Exportar progresso para arquivo JSON
    function exportProgress() {
      const data = {
        status: state.status,
        lastCategory: state.currentCategory,
        exportedAt: new Date().toISOString()
      };
      
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'review-progress.json';
      a.click();
      URL.revokeObjectURL(url);
      
      showToast('Progresso exportado!', 'success');
    }

    // Importar progresso de arquivo JSON
    function importProgress() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          
          if (data.status) {
            state.status = data.status;
            localStorage.setItem('reviewProgress', JSON.stringify(data.status));
          }
          if (data.lastCategory) {
            state.currentCategory = data.lastCategory;
            localStorage.setItem('lastCategory', data.lastCategory);
          }
          
          showToast('Progresso importado!', 'success');
          
          if (state.currentCategory) {
            loadFiles(state.currentCategory);
          }
        } catch (err) {
          showToast('Erro ao importar: arquivo inválido', 'error');
        }
      };
      
      input.click();
    }

    // Ir para arquivo anterior
    function goToPrev() {
      if (state.currentIndex > 0) {
        selectFile(state.currentIndex - 1);
      }
    }

    // Ir para próximo arquivo
    function goToNext() {
      if (state.currentIndex < state.filteredFiles.length - 1) {
        selectFile(state.currentIndex + 1);
      }
    }

    // Converter texto para slug
    function textToSlug(text) {
      return text
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-|-$/g, '');
    }

    // Calcular similaridade entre duas strings (Levenshtein normalizada)
    function similarity(a, b) {
      const la = a.length;
      const lb = b.length;
      if (la === 0 && lb === 0) return 1;
      if (la === 0 || lb === 0) return 0;

      const matrix = [];
      for (let i = 0; i <= lb; i++) {
        matrix[i] = [i];
      }
      for (let j = 0; j <= la; j++) {
        matrix[0][j] = j;
      }
      for (let i = 1; i <= lb; i++) {
        for (let j = 1; j <= la; j++) {
          const cost = b[i - 1] === a[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return 1 - matrix[lb][la] / Math.max(la, lb);
    }

    // Carregar todos os arquivos de todas as categorias
    async function loadAllFiles() {
      if (state.allFiles.length > 0) return state.allFiles;
      try {
        const res = await fetch('/api/search-all');
        const files = await res.json();
        state.allFiles = files;
        return files;
      } catch (err) {
        console.error('Erro ao carregar todos os arquivos:', err);
        return [];
      }
    }

    // Abrir modal de link
    async function openLinkModal() {
      const ta = els.editorTextarea;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const selectedText = ta.value.substring(start, end).trim();

      if (!selectedText) {
        showToast('Selecione um texto primeiro', 'error');
        return;
      }

      state.linkSelection = { text: selectedText, start, end };
      els.linkSelectedPreview.textContent = selectedText;
      els.linkSearchInput.value = selectedText;
      els.btnLinkInsert.disabled = true;
      els.btnLinkInsert.dataset.target = '';

      els.linkModalOverlay.style.display = 'flex';
      els.linkSearchInput.focus();

      await loadAllFiles();
      renderSuggestions(selectedText);
    }

    // Renderizar sugestões
    function renderSuggestions(query) {
      const slug = textToSlug(query);
      const queryLower = query.toLowerCase();
      
      const suggestions = state.allFiles.map(f => {
        const fileSlug = textToSlug(f.id);
        const titleLower = f.id.replace(/[-_]/g, ' ').toLowerCase();
        const snippetLower = (f.snippet || '').toLowerCase();

        let score = 0;

        // Prioridade 1: correspondência exata no nome
        if (fileSlug === slug) score = 1;
        else if (fileSlug.startsWith(slug)) score = 0.95;
        else if (slug.startsWith(fileSlug)) score = 0.9;
        else if (titleLower === queryLower) score = 0.95;
        else if (titleLower.includes(queryLower)) score = 0.85;
        else if (fileSlug.includes(slug)) score = 0.7;
        
        // Prioridade 2: correspondência nos pontos-chave (snippet)
        if (score < 0.5 && snippetLower) {
          const snippetPoints = snippetLower.split(' ').filter(p => p.length > 2);
          let matchCount = 0;
          const queryWords = slug.split('-').filter(w => w.length > 2);
          
          for (const qw of queryWords) {
            for (const sp of snippetPoints) {
              if (sp.includes(qw) || qw.includes(sp)) {
                matchCount++;
                break;
              }
            }
          }
          
          if (matchCount > 0) {
            const snippetScore = Math.min(0.6, matchCount * 0.15);
            if (snippetScore > score) score = snippetScore;
          }
        }

        // Prioridade 3: similaridade
        if (score < 0.3) {
          score = similarity(slug, fileSlug) * 0.4;
        }

        return { ...f, score };
      })
      .filter(f => f.score > 0.2)
      .sort((a, b) => b.score - a.score)
      .slice(0, 15);

      if (suggestions.length === 0) {
        els.suggestionsList.innerHTML = '<div class="no-results">Nenhum arquivo correspondente encontrado</div>';
        els.suggestionsLabel.textContent = 'Sugestões:';
        return;
      }

      const exact = suggestions.find(s => s.score >= 0.9);
      if (exact) {
        els.suggestionsLabel.textContent = 'Correspondência encontrada:';
      } else {
        els.suggestionsLabel.textContent = 'Sugestões (nenhuma correspondência exata):';
      }

      els.suggestionsList.innerHTML = suggestions.map(s => {
        const displayName = s.id.replace(/[-_]/g, ' ');
        const pct = Math.round(s.score * 100);
        return `
          <div class="suggestion-item" data-category="${s.category}" data-id="${s.id}" data-score="${s.score}">
            <span>${displayName}</span>
            <span class="cat-badge">${s.category}</span>
            <span class="match-score">${pct}%</span>
          </div>
        `;
      }).join('');

      els.suggestionsList.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          els.suggestionsList.querySelectorAll('.suggestion-item').forEach(i => i.style.background = '');
          item.style.background = '#0f3460';
          els.btnLinkInsert.disabled = false;
          els.btnLinkInsert.dataset.target = item.dataset.id;
          els.btnLinkInsert.dataset.category = item.dataset.category;
        });
      });
    }

    // Fechar modal de link
    function closeLinkModal() {
      els.linkModalOverlay.style.display = 'none';
      state.linkSelection = null;
      els.btnLinkInsert.disabled = true;
      els.btnLinkInsert.dataset.target = '';
    }

    // Inserir link
    function insertLink() {
      if (!state.linkSelection || !els.btnLinkInsert.dataset.target) return;

      const { text, start, end } = state.linkSelection;
      const targetId = els.btnLinkInsert.dataset.target;
      const link = `[${text}](${targetId}.md)`;

      const ta = els.editorTextarea;
      const before = ta.value.substring(0, start);
      const after = ta.value.substring(end);
      ta.value = before + link + after;

      ta.selectionStart = start;
      ta.selectionEnd = start + link.length;
      ta.focus();

      state.hasChanges = ta.value !== state.currentContent;
      els.hasChangesIndicator.style.display = state.hasChanges ? 'inline' : 'none';

      closeLinkModal();
      showToast('Link inserido!', 'success');
    }

    // Converter texto selecionado para tabela markdown
    function convertToTable() {
      const ta = els.editorTextarea;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const selectedText = ta.value.substring(start, end).trim();

      if (!selectedText) {
        showToast('Selecione um texto primeiro', 'error');
        return;
      }

      const lines = selectedText.split('\n').filter(line => line.trim());
      if (lines.length < 2) {
        showToast('Selecione pelo menos 2 linhas (cabeçalho + dados)', 'error');
        return;
      }

      const headers = lines[0].split(/\s{2,}|\t/).map(h => h.trim()).filter(h => h);
      const rows = lines.slice(1).map(line => {
        return line.split(/\s{2,}|\t/).map(cell => cell.trim()).filter(cell => cell);
      });

      if (headers.length === 0 || rows.length === 0 || rows[0].length === 0) {
        showToast('Não foi possível identificar colunas. Use 2+ espaços ou tab como separador.', 'error');
        return;
      }

      const colCount = headers.length;
      const markdown = [
        '| ' + headers.join(' | ') + ' |',
        '| ' + headers.map(() => '---').join(' | ') + ' |',
        ...rows.map(row => {
          const cells = row.length >= colCount ? row.slice(0, colCount) : [...row];
          while (cells.length < colCount) cells.push('');
          return '| ' + cells.join(' | ') + ' |';
        })
      ].join('\n');

      const before = ta.value.substring(0, start);
      const after = ta.value.substring(end);
      ta.value = before + markdown + after;

      ta.selectionStart = start;
      ta.selectionEnd = start + markdown.length;
      ta.focus();

      state.hasChanges = ta.value !== state.currentContent;
      els.hasChangesIndicator.style.display = state.hasChanges ? 'inline' : 'none';

      showToast('Tabela criada!', 'success');
    }

    // Event listeners
    els.categorySelect.addEventListener('change', (e) => {
      if (e.target.value) {
        loadFiles(e.target.value);
      }
    });

    els.statusFilter.addEventListener('change', (e) => {
      state.statusFilter = e.target.value;
      applyFilters();
    });

    els.searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      applyFilters();
    });

    els.editorTextarea.addEventListener('input', () => {
      state.hasChanges = els.editorTextarea.value !== state.currentContent;
      els.hasChangesIndicator.style.display = state.hasChanges ? 'inline' : 'none';
    });

    els.btnSave.addEventListener('click', saveContent);
    els.btnApprove.addEventListener('click', () => setStatus('approved'));
    els.btnNeedsFix.addEventListener('click', () => setStatus('needs-fix'));
    els.btnDelete.addEventListener('click', deleteCurrentFile);
    els.btnPrev.addEventListener('click', goToPrev);
    els.btnNext.addEventListener('click', goToNext);
    els.btnLink.addEventListener('click', openLinkModal);
    els.btnTable.addEventListener('click', convertToTable);
    els.btnExport.addEventListener('click', exportProgress);
    els.btnImport.addEventListener('click', importProgress);
    els.btnLinkCancel.addEventListener('click', closeLinkModal);
    els.btnLinkInsert.addEventListener('click', insertLink);
    els.linkModalOverlay.addEventListener('click', (e) => {
      if (e.target === els.linkModalOverlay) closeLinkModal();
    });
    els.linkSearchInput.addEventListener('input', (e) => {
      renderSuggestions(e.target.value);
    });

    // Atalhos de teclado
    document.addEventListener('keydown', (e) => {
      // Ctrl+S para salvar
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        saveContent();
      }

      // Ctrl+← para anterior
      if (e.ctrlKey && e.key === 'ArrowLeft') {
        e.preventDefault();
        goToPrev();
      }

      // Ctrl+→ para próximo
      if (e.ctrlKey && e.key === 'ArrowRight') {
        e.preventDefault();
        goToNext();
      }

      // Ctrl+Enter para aprovar
      if (e.ctrlKey && e.key === 'Enter') {
        e.preventDefault();
        setStatus('approved');
      }

      // Ctrl+1 para "precisa corrigir"
      if (e.ctrlKey && e.key === '1') {
        e.preventDefault();
        setStatus('needs-fix');
      }

      // Ctrl+2 para pular
      if (e.ctrlKey && e.key === '2') {
        e.preventDefault();
        setStatus('skipped');
      }

      // Ctrl+K para criar link
      if (e.ctrlKey && e.key === 'k') {
        e.preventDefault();
        openLinkModal();
      }

      // Ctrl+T para criar tabela
      if (e.ctrlKey && e.key === 't') {
        e.preventDefault();
        convertToTable();
      }

      // Escape para fechar modal de link
      if (e.key === 'Escape' && els.linkModalOverlay.style.display === 'flex') {
        e.preventDefault();
        closeLinkModal();
      }

      // Enter para inserir link quando modal aberto
      if (e.key === 'Enter' && els.linkModalOverlay.style.display === 'flex' && !els.btnLinkInsert.disabled) {
        e.preventDefault();
        insertLink();
      }
    });

    // Aviso ao sair com alterações não salvas
    window.addEventListener('beforeunload', (e) => {
      if (state.hasChanges) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // Inicialização
    loadProgress();
    loadCategories();
  </script>
</body>
</html>
